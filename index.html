<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目文档中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: #0b0d11;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── 动态粒子背景 ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            will-change: transform;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.35), rgba(99, 102, 241, 0.10));
            top: -15%;
            left: -8%;
            animation: orbFloat1 18s var(--ease-out-expo) infinite alternate;
        }
        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle at 70% 70%, rgba(168, 85, 247, 0.30), rgba(236, 72, 153, 0.08));
            bottom: -12%;
            right: -6%;
            animation: orbFloat2 22s var(--ease-out-expo) infinite alternate;
        }
        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.20), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 25s var(--ease-out-expo) infinite alternate;
        }

        @keyframes orbFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, 100px) scale(1.15); }
        }
        @keyframes orbFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, -80px) scale(1.2); }
        }
        @keyframes orbFloat3 {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-40%, -40%) scale(1.3); opacity: 1; }
        }

        /* ── 网格纹理覆盖层 ── */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── 主卡片容器 ── */
        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
        }

        /* ── 玻璃态卡片 ── */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 48px 44px 40px;
            box-shadow:
                0 24px 80px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 0.4s var(--ease-out-expo);
        }

        /* ── 徽标/图标 ── */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 8px 24px -4px rgba(59, 130, 246, 0.35);
        }
        .brand-label {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        /* ── 标题 ── */
        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        /* ── 文档列表 ── */
        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            transition: all 0.35s var(--ease-out-expo);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .doc-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(139, 92, 246, 0.04));
            opacity: 0;
            transition: opacity 0.4s var(--ease-out-expo);
            border-radius: inherit;
        }
        .doc-item:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.10);
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
        }
        .doc-item:hover::before {
            opacity: 1;
        }
        .doc-item:active {
            transform: translateY(0) scale(0.99);
        }

        .doc-icon {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
            z-index: 1;
        }
        .doc-icon.blue {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.20), rgba(59, 130, 246, 0.06));
            color: #60a5fa;
        }
        .doc-icon.purple {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.20), rgba(168, 85, 247, 0.06));
            color: #c084fc;
        }

        .doc-info {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }
        .doc-name {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3px;
            line-height: 1.4;
        }
        .doc-meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }

        .doc-arrow {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.35s var(--ease-out-expo);
            position: relative;
            z-index: 1;
        }
        .doc-item:hover .doc-arrow {
            color: rgba(255, 255, 255, 0.7);
            transform: translateX(4px);
        }

        /* ── 底部 ── */
        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.18);
            letter-spacing: 0.3px;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.25);
            text-decoration: none;
            transition: color 0.25s;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ── 入场动画 ── */
        .card > * {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.7s var(--ease-out-expo) forwards;
        }
        .card > .brand { animation-delay: 0.05s; }
        .card > h1 { animation-delay: 0.10s; }
        .card > .subtitle { animation-delay: 0.15s; }
        .card > .doc-list { animation-delay: 0.20s; }
        .doc-list .doc-item:nth-child(1) { animation-delay: 0.25s; }
        .doc-list .doc-item:nth-child(2) { animation-delay: 0.30s; }
        .card > .footer { animation-delay: 0.35s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── 响应式 ── */
        @media (max-width: 540px) {
            body { padding: 16px; }
            .card { padding: 32px 20px 28px; border-radius: 24px; }
            h1 { font-size: 22px; }
            .doc-item { padding: 14px 16px; gap: 14px; }
            .doc-icon { width: 38px; height: 38px; font-size: 17px; }
            .doc-name { font-size: 14px; }
            .orb-1 { width: 300px; height: 300px; }
            .orb-2 { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>

    <!-- 动态光晕 -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>

    <main>
        <div class="card">

            <div class="brand">
                <div class="brand-icon">&#9881;</div>
                <span class="brand-label">JBC · MES</span>
            </div>

            <h1>项目文档中心</h1>
            <p class="subtitle">大宗物料销售出库系统 &mdash; 需求与流程文档</p>

            <div class="doc-list">
                <a class="doc-item" href="大宗物料销售出库项目需求v4.0.html">
                    <div class="doc-icon blue">&#128196;</div>
                    <div class="doc-info">
                        <div class="doc-name">大宗物料销售出库项目需求 v4.0</div>
                        <div class="doc-meta">需求规格说明书 &middot; 终版</div>
                    </div>
                    <div class="doc-arrow">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </div>
                </a>

                <a class="doc-item" href="核心业务流程图.html">
                    <div class="doc-icon purple">&#128200;</div>
                    <div class="doc-info">
                        <div class="doc-name">核心业务流程图</div>
                        <div class="doc-meta">整体流程 &middot; 状态流转 &middot; 异常分支</div>
                    </div>
                    <div class="doc-arrow">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </div>
                </a>
            </div>

            <div class="footer">
                基于 <a href="https://github.com/USTBrui/jbc-mes-HTML" target="_blank" rel="noopener">GitHub Pages</a> 部署
            </div>

        </div>
    </main>

</body>
</html>
